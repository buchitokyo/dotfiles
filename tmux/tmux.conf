# ==============================================================================
# tmux 設定
# ==============================================================================

# --- prefix キー ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- パフォーマンス ---
set -s escape-time 0
set -g history-limit 50000
set -g status-interval 5
setw -g aggressive-resize on
set -g repeat-time 1000

# --- 番号 ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- マウス ---
set -g mouse on

# --- Vi copy-mode ---
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'
bind Escape copy-mode

# --- ペイン分割（パス引き継ぎ） ---
bind v split-window -h -c "#{pane_current_path}"
bind V split-window -hb -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind S split-window -vb -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- ペインリサイズ（prefix + H/J/K/L） ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- ペイン移動（vim-tmux-navigator 連携） ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind -n C-Left select-pane -L
bind -n C-Down select-pane -D
bind -n C-Up select-pane -U
bind -n C-Right select-pane -R

# --- ペイン移動（ウィンドウ跨ぎ対応） ---
bind -n M-Left run-shell 'cur="#{pane_id}"; tmux select-pane -L; [ "$cur" = "$(tmux display -p "#{pane_id}")" ] && tmux select-window -t :-; true'
bind -n M-Right run-shell 'cur="#{pane_id}"; tmux select-pane -R; [ "$cur" = "$(tmux display -p "#{pane_id}")" ] && tmux select-window -t :+; true'

# --- Claude Code トグル（Alt+c） ---
bind -n M-c run-shell '~/.config/tmux/toggle-claude-pane.sh "#{pane_id}"'

# --- yazi ポップアップ（prefix + y） ---
bind y display-popup -E -w 90% -h 90% -d "#{pane_current_path}" \
  "tmux new-session '~/.config/tmux/yazi-popup.sh #{pane_id}' \; set status off \; set detach-on-destroy on"

# --- 自動レイアウト調整 ---
set-hook -g after-split-window "select-layout -E"
set-hook -g pane-exited "select-layout -E"

# --- fzf 連携 ---
bind W run-shell "tmux list-windows -F '#{window_index}: #{window_name}' | fzf-tmux -p --reverse | cut -d: -f1 | xargs tmux select-window -t"
bind P run-shell "tmux list-panes -F '#{pane_index}: #{pane_current_command}' | fzf-tmux -p --reverse | cut -d: -f1 | xargs tmux select-pane -t"

# --- Cmd キーパススルー（Ghostty → tmux → Neovim） ---
set -s user-keys[8] "\e[115;9~"
set -s user-keys[9] "\e[122;9~"
set -s user-keys[10] "\e[121;9~"
set -s user-keys[11] "\e[97;9~"
set -s user-keys[12] "\e[99;9~"
set -s user-keys[13] "\e[118;9~"
set -s user-keys[0] "\e[112;9~"
set -s user-keys[1] "\e[70;10~"
set -s user-keys[2] "\e[80;10~"
set -s user-keys[3] "\e[98;9~"
set -s user-keys[4] "\e[47;9~"
set -s user-keys[5] "\e[96;9~"
set -s user-keys[6] "\e[106;9~"
set -s user-keys[7] "\e[74;10~"

bind-key -n User8 send-keys -l "\e[115;9u"
bind-key -n User9 send-keys -l "\e[122;9u"
bind-key -n User10 send-keys -l "\e[121;9u"
bind-key -n User11 send-keys -l "\e[97;9u"
bind-key -n User12 send-keys -l "\e[99;9u"
bind-key -n User13 send-keys -l "\e[118;9u"
bind-key -n User0 send-keys -l "\e[112;9u"
bind-key -n User1 send-keys -l "\e[70;10u"
bind-key -n User2 send-keys -l "\e[80;10u"
bind-key -n User3 send-keys -l "\e[98;9u"
bind-key -n User4 send-keys -l "\e[47;9u"
bind-key -n User5 send-keys -l "\e[96;9u"
bind-key -n User6 send-keys -l "\e[106;9u"
bind-key -n User7 send-keys -l "\e[74;10u"

# --- プラグイン（tpm） ---
set -g @plugin 'tmux-plugins/tpm'

# tmux-fzf: F で起動（prefix + F）
set -g @plugin 'sainnhe/tmux-fzf'
set -g @tmux-fzf-launch-key "F"
set -g @TMUX_FZF_OPTIONS "-p -w 80% -h 80% -m"

# tmux-thumbs: Space で起動（qwerty-homerow）
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key Space
set -g @thumbs-alphabet qwerty-homerow
set -g @thumbs-reverse enabled
set -g @thumbs-unique enabled

# tmux-session-wizard: T で起動
set -g @plugin '27medkamal/tmux-session-wizard'
set -g @session-wizard 'T'

# extrakto: Tab で起動（pbcopy）
set -g @plugin 'laktak/extrakto'
set -g @extrakto_key "Tab"
set -g @extrakto_split_size "15"
set -g @extrakto_clip_tool "pbcopy"
set -g @extrakto_fzf_tool "fzf"

# tmux-resurrect & tmux-continuum
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- tpm 初期化（末尾に配置） ---
run '~/.tmux/plugins/tpm/tpm'
